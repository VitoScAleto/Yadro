---
- name: Установка Docker на Ubuntu
  hosts: remote_server
  become: yes
  gather_facts: yes
  
  tasks:
    - name: "Обновление apt кэша"
      apt:
        update_cache: yes
        upgrade: dist
      when: ansible_distribution == "Ubuntu"
    
    - name: "Добавление GPG ключа Docker"
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: ansible_distribution == "Ubuntu"
    
    - name: "Добавление репозитория Docker"
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: yes
      when: ansible_distribution == "Ubuntu"
    
    - name: "Установка Docker"
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
    
    - name: "Cоздание группы docker"
      group:
        name: docker
        state: present
    
    - name: "Добавление {{ ansible_user }} в группу docker"
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
    
    - name: "Запуск и включение Docker"
      systemd:
        name: docker
        state: started
        enabled: yes
    
    - name: "Проверка версии Docker"
      command: docker --version
      register: docker_version
    
    - name: "Результат"
      debug:
        msg:
          - "Версия: {{ docker_version.stdout }}"
          - "Пользователь: {{ ansible_user }} (в группе docker)"